<!DOCTYPE html>
<html lang="pl">
<head>          
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>     
</head>
<body>  
    <form action="skrypt.php" method="post"> 
        <label for="imie">Imię</label>
        <input type="text" id="imie" name="imie" placeholder="Wpisz swoje imię" required>
        <fieldset>
            <legend>Dane do logowania</legend>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Wpisz swój email" required>
            <label for="haslo">Hasło</label>
            <input type="password" id="haslo" name="haslo" placeholder="Wpisz swoje hasło" maxlength="15">
        </fieldset>
        <label for="wiek">Wiek</label>
        <input type="number" id="wiek" name="wiek" min="18" max="100" placeholder="Wiek">
        <label for="telefon">Telefon</label>
        <input type="tel" id="telefon" name="telefon" placeholder="Wpisz swój numer telefonu" 
        pattern="[+][0-9]{2} [0-9]{3}-[0-9]{3}-[0-9]{3}"
        title="Format: +48 123-456-789">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" placeholder="Wpisz datę">
        <label for="komentarz">Komentarz</label>
        <textarea id="komentarz" name="komentarz" cols="40" rows="6" minlength="10" placeholder="Wpisz swój komentarz" required></textarea>
        <input type="submit" value="Wyślij">
        <button type="submit">Wyślij</button>
        <select>
          <option value="" disabled selected>Wybierz kategorię</option>
        <option value="reklamacja">Reklamacja</option>
        <option value="zapytanie">Zapytanie</option>
        <option value="dodinfo">Dodatkowe informacje</option>
        <option value="inne">Inne</option>
    </select>
         <input type="checkbox" id="zgoda" name="zgodaNaPrzetwarzanieDanychOsobowych" value="tak" required> <label for="zgoda">Zgoda na przetwarzanie danych osobowych</label>
    <p>Preferowana forma kontaktu:</p>
    <input type="radio" name="kontakt" value="telefon">Telefon
    <input type="radio" name="kontakt" value="email">Email
    <input type="radio" name="kontakt" value="messenger">Messenger
    </form>

    
      


</body>
